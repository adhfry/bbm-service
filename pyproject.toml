[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) in argument defaults is FastAPI's required DI pattern,
# not a real bug -- every route in this codebase legitimately does this.
ignore = ["B008"]
